<ion-header mode="md" class="ion-no-border">
  <ion-toolbar>    
    <ion-buttons slot="end">            
      <ion-button (click)="close(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <img id="myImage" alt="your img" [hidden]="type !== 'blob'">
  <img [src]="photo" alt="your img" [hidden]="type !== 'base64'">  
</ion-content>
